[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 128
fail_on_revert = true

[fmt]
line_length = 110
